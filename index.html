<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Info Card</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- USER INFO CARD -->

        <div class="form-card">

            <h1>
                <i class="fa-solid fa-circle-user"></i>
                User Info
            </h1>

            <p>Enter your information below.</p>

            <form id="userForm">

                <!-- TWO COLUMNS -->

                <div class="form-grid">

                    <!-- LEFT COLUMN -->

                    <div class="form-column">

                        <label for="fullName">
                            <i class="fa-solid fa-user"></i>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                        >


                        <label for="email">
                            <i class="fa-solid fa-envelope"></i>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                        >


                        <label for="age">
                            <i class="fa-solid fa-hashtag"></i>
                            Age
                        </label>

                        <input
                            type="number"
                            id="age"
                            placeholder="Enter your age"
                        >


                        <label for="birthday">
                            <i class="fa-solid fa-cake-candles"></i>
                            Birthday
                        </label>

                        <input
                            type="date"
                            id="birthday"
                        >


                        <label for="phone">
                            <i class="fa-solid fa-phone"></i>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                        >

                    </div>


                    <!-- RIGHT COLUMN -->

                    <div class="form-column">

                        <label for="address">
                            <i class="fa-solid fa-location-dot"></i>
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="Enter your address"
                        >


                        <label for="course">
                            <i class="fa-solid fa-book"></i>
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            placeholder="Enter your course"
                        >


                        <label for="school">
                            <i class="fa-solid fa-school"></i>
                            School
                        </label>

                        <input
                            type="text"
                            id="school"
                            placeholder="Enter your school"
                        >


                        <label for="hobby">
                            <i class="fa-solid fa-heart"></i>
                            Favorite Hobby
                        </label>

                        <input
                            type="text"
                            id="hobby"
                            placeholder="Enter your hobby"
                        >


                        <label for="country">
                            <i class="fa-solid fa-globe"></i>
                            Country
                        </label>

                        <input
                            type="text"
                            id="country"
                            placeholder="Enter your country"
                        >

                    </div>

                </div>


                <!-- GENDER -->

                <div class="gender">

                    <label>
                        <i class="fa-solid fa-venus-mars"></i>
                        Gender
                    </label>

                    <label class="radio">
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        <i class="fa-solid fa-mars"></i>
                        Male
                    </label>

                    <label class="radio">
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        <i class="fa-solid fa-venus"></i>
                        Female
                    </label>

                </div>


                <!-- BUTTON -->

                <button type="button" id="showButton">
                    <i class="fa-solid fa-eye"></i>
                    SHOW MY INFO
                </button>

            </form>

        </div>


        <!-- MY INFORMATION CARD -->

        <div class="info-card">

            <h2>
                <i class="fa-solid fa-address-card"></i>
                My Information
            </h2>

            <div class="info-grid">

                <!-- LEFT 5 -->

                <div class="info-column">

                    <div>
                        <i class="fa-solid fa-user"></i>
                        <span>Full Name</span>
                        <strong id="displayName">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-envelope"></i>
                        <span>Email</span>
                        <strong id="displayEmail">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-hashtag"></i>
                        <span>Age</span>
                        <strong id="displayAge">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-cake-candles"></i>
                        <span>Birthday</span>
                        <strong id="displayBirthday">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-phone"></i>
                        <span>Phone</span>
                        <strong id="displayPhone">—</strong>
                    </div>

                </div>


                <!-- RIGHT 6 -->

                <div class="info-column">

                    <div>
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Address</span>
                        <strong id="displayAddress">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-book"></i>
                        <span>Course</span>
                        <strong id="displayCourse">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-school"></i>
                        <span>School</span>
                        <strong id="displaySchool">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-heart"></i>
                        <span>Favorite Hobby</span>
                        <strong id="displayHobby">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-globe"></i>
                        <span>Country</span>
                        <strong id="displayCountry">—</strong>
                    </div>

                    <div>
                        <i class="fa-solid fa-venus-mars"></i>
                        <span>Gender</span>
                        <strong id="displayGender">—</strong>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
