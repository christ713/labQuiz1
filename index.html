<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Info Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- =========================
             USER INFORMATION FORM
        ========================== -->

        <div class="form-section">

            <h1>User Info Card</h1>

            <p>Enter your information below.</p>

            <form id="userForm">

                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                >


                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >


                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                >


                <label for="birthday">Birthday</label>
                <input
                    type="date"
                    id="birthday"
                >


                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                >


                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    placeholder="Enter your address"
                >


                <label for="course">Course</label>
                <input
                    type="text"
                    id="course"
                    placeholder="Enter your course"
                >


                <label for="school">School</label>
                <input
                    type="text"
                    id="school"
                    placeholder="Enter your school"
                >


                <label for="hobby">Favorite Hobby</label>
                <input
                    type="text"
                    id="hobby"
                    placeholder="Enter your hobby"
                >


                <label for="color">Favorite Color</label>

                <select id="color">

                    <option value="">
                        Select a color
                    </option>

                    <option value="Red">
                        Red
                    </option>

                    <option value="Blue">
                        Blue
                    </option>

                    <option value="Green">
                        Green
                    </option>

                    <option value="Purple">
                        Purple
                    </option>

                    <option value="Black">
                        Black
                    </option>

                </select>


                <!-- GENDER -->

                <div class="gender-group">

                    <label>Gender</label>

                    <label class="radio">
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>

                    <label class="radio">
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                </div>


                <!-- BUTTON -->

                <button
                    type="button"
                    id="showButton"
                >
                    SHOW MY INFO
                </button>

            </form>

        </div>


        <!-- =========================
             INFORMATION OUTPUT
        ========================== -->

        <div class="output">

            <h2>My Information</h2>

            <p class="info-item">
                <span>Full Name</span>
                <strong id="displayName">—</strong>
            </p>

            <p class="info-item">
                <span>Email</span>
                <strong id="displayEmail">—</strong>
            </p>

            <p class="info-item">
                <span>Age</span>
                <strong id="displayAge">—</strong>
            </p>

            <p class="info-item">
                <span>Birthday</span>
                <strong id="displayBirthday">—</strong>
            </p>

            <p class="info-item">
                <span>Phone</span>
                <strong id="displayPhone">—</strong>
            </p>

            <p class="info-item">
                <span>Address</span>
                <strong id="displayAddress">—</strong>
            </p>

            <p class="info-item">
                <span>Course</span>
                <strong id="displayCourse">—</strong>
            </p>

            <p class="info-item">
                <span>School</span>
                <strong id="displaySchool">—</strong>
            </p>

            <p class="info-item">
                <span>Favorite Hobby</span>
                <strong id="displayHobby">—</strong>
            </p>

            <p class="info-item">
                <span>Favorite Color</span>
                <strong id="displayColor">—</strong>
            </p>

            <p class="info-item">
                <span>Gender</span>
                <strong id="displayGender">—</strong>
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
